# MiniStack sayti uchun Netlify sozlamasi.
# Build kerak emas: papkaning o'zi (ildizi) nashr qilinadi.

[build]
  publish = "."

# Barcha sahifalar uchun xavfsizlik sarlavhalari
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# APK / EXE / ZIP: brauzer ochmasdan, yuklab olsin
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"
